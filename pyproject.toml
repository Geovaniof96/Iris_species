[project]
name = "iris-species"
version = "0.1.0"
description = "Pipeline de dados do dataset Iris (Kaggle): extração para raw/ e camadas raw, refined e analytics no DuckDB."
authors = [
    {name = "Geovanio Cavalcante", email = "geo.cavalcante1@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "duckdb (>=2.0.0,<3.0.0)",
    "kagglehub (>=1.0.3,<2.0.0)",
    "pandas (>=3.1.0,<4.0.0)",
    "streamlit (>=1.66.1,<2.0.0)",
    "plotly (>=7.1.0,<8.0.0)"
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
packages = [{include = "iris_species", from = "src"}]

[dependency-groups]
dev = [
    "ruff (>=0.17.3,<0.18.0)",
    "pytest (>=9.2.0,<10.0.0)",
    "pytest-cov (>=7.1.0,<8.0.0)",
    "pytest-mock (>=3.17.0,<4.0.0)",
    "mypy (>=2.4.1,<3.0.0)",
    "pre-commit (>=4.7.0,<5.0.0)",
    "pandas-stubs (>=3.1.0.261029,<4.0.0.0)"
]
docs = [
    "mkdocs-material (>=9.8.0,<10.0.0)",
    "mkdocstrings[python] (>=1.0.8,<2.0.0)"
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "N", "C4", "PL", "RUF", "S"]

[tool.ruff.lint.per-file-ignores]
"src/iris_species/clients/*.py" = [
    "S608", # SQL montado com nomes de schema/tabela internos e entre aspas (D3), nunca entrada do usuário
]
"tests/**/*.py" = [
    "S101",    # assert é o idioma do pytest
    "PLR2004", # valores mágicos são esperados em asserts
    "S608",    # consultas de verificação com nomes fixos
]

[tool.ruff.lint.isort]
known-first-party = ["iris_species"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib --cov=src/iris_species --cov-report=term-missing --cov-fail-under=50"

[tool.coverage.run]
source = ["src/iris_species"]
branch = true
omit = ["*/__init__.py"]

[tool.coverage.report]
show_missing = true
skip_empty = true

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
strict = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["kagglehub.*", "plotly.*"]
ignore_missing_imports = true
